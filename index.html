<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="Christophe Lamperti">
  <meta name="theme-color" content="#F4F4F4">
  <title>Dial · Pull better espresso shots, faster</title>
  <meta name="description" content="Dial is an espresso app for iPhone that learns your grinder and your bag, then tells you where to go next. Free, no account.">
  <meta property="og:title" content="Dial">
  <meta property="og:description" content="Pull better espresso shots, faster. Free on iPhone, no account.">
  <meta property="og:image" content="https://dialespresso.app/apple-touch-icon.png">
  <link rel="icon" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css?v=202611241000">
</head>
<body>

  <div class="ruler" aria-hidden="true"><div class="needle"></div></div>

  <main>
    <section class="hero">
      <div class="wrap">
        <div class="intro">
          <div class="lockup">
            <span class="iconwrap"><span class="iconring"><img class="icon" src="/assets/icon.webp" alt="Dial's icon: a dial with a red dot" width="72" height="72"></span></span>
            <h1>Dial</h1>
          </div>
          <p class="tagline">Pull better espresso shots, faster.</p>
          <a href="https://testflight.apple.com/join/yrKBnctM" class="download"><span>Download for iOS</span></a>
        </div>
        <figure class="stage">
          <button class="step prev" type="button" aria-label="Previous screen"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5"/></svg></button>
          <div class="holder">
            <div class="device">
              <div class="frame">
              <div class="bezel"><div class="screen">
                <img class="on" src="/assets/shelf.webp" alt="The shelf: all your bags of coffee, in their real colors" width="860" height="1870" data-title="All your bags at a glance." data-sub="Each bag follows its roaster's colors and shape, with your best grind setting and your rating.">
                <img src="/assets/prep.webp" alt="The grind dial, set where Dial recommends" width="860" height="1870" data-title="No more guessing the grind." data-sub="Dial figures out the best next setting from your past shots and your taste notes." loading="lazy">
                <img src="/assets/taste-dialed.webp" alt="The taste slider set to Dialed in" width="860" height="1870" data-title="A simple way to rate a shot." data-sub="One simple slider, no barista training needed. Dial uses it to refine your next shot." loading="lazy">
                <img src="/assets/pull.webp" alt="A shot in progress, weighed and timed on the scale" width="860" height="1870" data-title="Stop on the beep." data-sub="Pair an Acaia Lunar scale and Dial will log the shot by itself. Just stop the extraction when you hear the beep." loading="lazy">
                <img src="/assets/newbag.webp" alt="A new bag, filled in from the roaster" width="860" height="1870" data-title="Add every bag in seconds." data-sub="Origin, process and roast level are already filled in. Dial tells you when a bag needs to rest and when it's ready to brew." loading="lazy">
                <img src="/assets/roasters.webp" alt="The list of roasters" width="860" height="1870" data-title="48 US roasters, built in." data-sub="Just pick a coffee and add the roast date." loading="lazy">
                <img src="/assets/bag.webp" alt="A bag's page with its shots" width="860" height="1870" data-title="Never start from scratch." data-sub="Each bag keeps the full history of your shots, so you stop wasting beans." loading="lazy">
              </div></div>
            </div>
            </div>
            <figcaption class="label" aria-live="polite">
              <p class="title">All your bags at a glance.</p>
              <p class="sub">Each bag follows its roaster's colors and shape, with your best grind setting and your rating.</p>
            </figcaption>
          </div>
          <button class="step next" type="button" aria-label="Next screen"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"/></svg></button>
        </figure>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap">
      <div>
        <span>Made by <a href="https://lamperti.me" target="_blank" rel="noopener">Christophe Lamperti</a></span>
        <nav><a href="/support">Support</a><a href="/privacy">Privacy</a><a href="mailto:hello@dialespresso.app">hello@dialespresso.app</a></nav>
      </div>
    </div>
  </footer>

  <script src="/app.js?v=202611231711"></script>
</body>
</html>
